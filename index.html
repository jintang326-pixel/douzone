 try{const pm=await claude.use('permissions');if(pm){const s=await pm.state('room');if(s==='denied'){ERR='联机权限被拒绝：请在页面的「权限」菜单里允许联机后重试。';return null}if(s==='prompt'){net('正在请求联机权限…','如果页面弹出权限窗口，请点「允许」');const q=await pm.request(['room']);if(q.room==='denied'){ERR='联机权限被拒绝：请在页面的「权限」菜单里允许联机后重试。';return null}}}}catch(e){}
 const r=await claude.use('room');if(!r)ERR='联机服务不可用：请确认你和朋友都已登录 Claude，并且朋友与你同一组织或已被你邀请访问这个页面。';return r}
async function joinRetry(r){let last='';for(let i=1;i<=3;i++){try{net('正在连接房间 '+ROOM+'…','第 '+i+' 次尝试（最多等待 10 秒）');return await r.join('arena'+ROOM)}catch(e){last=(e&&(e.code||e.message))||'unknown';if(last==='not_permitted'||last==='invalid_argument')break;await new Promise(z=>setTimeout(z,800))}}
 ERR=last==='not_permitted'?'当前账号不能加入联机房间：朋友需要登录 Claude，并与你同一组织或被你邀请访问此页面（公开链接、未登录无法联机）。':'连接房间超时或失败（'+last+'），请检查网络后重试。';return null}
async function goOnline(){try{for(let i=0;i<30&&!window.claude;i++)await new Promise(r=>setTimeout(r,100));const r=await roomApi();if(!r){ERR=ERR||'无法连接联机服务：需要登录，并且是该页面所属组织的成员或受邀者。';return false}ONL=await joinRetry(r);if(!ONL)return false;
 ONL.onPeers(c=>{PEERS=c.peers.length;const seen={};c.peers.forEach(p=>{const pr=p.presence;if(!pr||pr.x===undefined||pr.id===MYID)return;seen[pr.id]=1;let o=remotes[pr.id];if(!o){o=remotes[pr.id]=mkBot(true);o.peer=p.peer;o.pid=pr.id;o.n=String(pr.id||p.peer).slice(0,2);feedL.push({t:TT+4,s:'玩家 '+o.n+' 加入了房间'});o.x=+pr.x;o.z=+pr.z;bots.push(o)}o.tx=+pr.x;o.tz=+pr.z;o.yw=+pr.yw||0;o.hp=+pr.hp;o.s=pr.s;{const cum=(pr.hd&&pr.hd[MYID])||0,last=SH[o.pid]||0;SH[o.pid]=cum;if(cum>last&&(st==='play'||st==='buy'||st==='pause')){P.lastBy=o.pid;hurt(Math.min(260,cum-last),{x:o.x,z:o.z})}const dcn=+pr.dc||0,dl=SD[o.pid]||0;SD[o.pid]=dcn;if(dcn>dl&&pr.db===MYID){kills++;money+=50;P.ks=(P.ks||0)+1;killFx('玩家'+String(o.pid||'').slice(0,2),false,P.ks);feedL.push({t:TT+4,s:'你 ▸ 玩家'+String(o.pid||'').slice(0,2)+' +$50'})}}if(o.hp>0){o.g.rotation.x=0;o.g.position.y=0;o.gun.visible=true}else{o.g.rotation.x=-1.4;o.g.position.y=.35;o.gun.visible=false}});
  for(const k in remotes)if(!seen[k]){rmBot(remotes[k]);bots=bots.filter(b=>b!==remotes[k]);delete remotes[k]}});
 ONL.on('hit',m=>{const d=m.data;if(!d||d.to!==MYID||!(st==='play'||st==='buy'||st==='pause'))return;const last=SH[d.from]||0;if(!(d.tot>last))return;SH[d.from]=d.tot;P.lastBy=d.from;const o=remotes[d.from];hurt(Math.min(260,d.tot-last),o?{x:o.x,z:o.z}:null)});
 ONL.on('died',m=>{const d=m.data;if(!d||!(d.dc>(SD[d.v]||0)))return;SD[d.v]=d.dc;if(d.by!==MYID)return;kills++;money+=50;P.ks=(P.ks||0)+1;killFx('玩家'+String(d.by||'').slice(0,2),false,P.ks);feedL.push({t:TT+4,s:'你 ▸ 玩家'+m.peer.slice(0,2)+' +$50'})});
 try{CONN=ONL.connected();ONL.onConnection(v=>{CONN=v})}catch(e){CONN=true}ONL.presence({id:MYID,x:P.x,z:P.z,yw:P.yaw,hp:100});return true}catch(e){ERR='加入失败：'+((e&&(e.message||e.code))||'网络错误')+'，请重试。';ONL=null;return false}}

// ---------- input ----------
function lock(){try{const p=rd.domElement.requestPointerLock({unadjustedMovement:true});if(p&&p.catch)p.catch(()=>{try{rd.domElement.requestPointerLock()}catch(e){}})}catch(e){}}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===rd.domElement;if(locked)wasL=true;else if(wasL&&(st==='play'||st==='buy'))pauseNow()});
document.addEventListener('mousemove',e=>{if(!locked)return;const k=(scoped?.35:1)*sens*.0022;P.yaw-=e.movementX*k;P.pit=Math.max(-1.45,Math.min(1.45,P.pit-e.movementY*k))});
$('w').addEventListener('mousedown',e=>{if(st==='menu'||st==='pause'||st==='boot')return;lock();if(st==='buy'){ready();return}if(e.button===2){setScope(true);return}if(e.button===0)firing=true});
addEventListener('mouseup',e=>{firing=false;if(e.button===2)setScope(false)});addEventListener('contextmenu',e=>e.preventDefault());addEventListener('blur',()=>{firing=false;K={}});
addEventListener('keydown',e=>{K[e.code]=true;if(e.target.tagName==='INPUT')return;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
 if(e.code==='KeyR')reload();if(e.code==='KeyB')toggleShop();if(e.code==='KeyX')sell();if(e.code==='KeyQ')throwN();if(e.code==='KeyE')cycleN();if(e.code==='KeyH')useMed();if(e.code==='KeyV'){setQ((QL+1)%5)}
 if(e.code==='BracketLeft')sens=Math.max(.3,sens-.1);if(e.code==='BracketRight')sens=Math.min(3,sens+.1);
 if(e.code.startsWith('Digit'))buy((+e.code[5]||10)-1);if(e.code==='Minus'||e.code==='KeyZ')buy(10);if(e.code==='Equal'||e.code==='KeyT')buy(11);if((e.code==='Enter'||e.code==='Space')&&st==='buy')ready()});
addEventListener('keyup',e=>K[e.code]=false);
$('gear').onmousedown=e=>e.stopPropagation();$('gear').onclick=()=>{document.exitPointerLock();pauseNow()};

// ---------- render loop ----------
const mm=$('mm').getContext('2d');let last=performance.now(),fcn=0,fT=last,fps=0,hT=0,mT=0,fov=78,pT=0,TS=1;
function drawMap(){const c=8;mm.clearRect(0,0,160,160);mm.fillStyle='rgba(10,16,24,.78)';mm.fillRect(0,0,160,160);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=grid[y*N+x];if(t){mm.fillStyle=t==1?'#56708c':'#8fa3b8';mm.fillRect(x*c,y*c,c,c)}}
 bots.forEach(b=>{if(b.hp>0&&(b.fl>0||(Math.hypot(b.x-P.x,b.z-P.z)<42&&clear(b.x,b.z,P.x,P.z)))){mm.fillStyle=b.remote?'#5aa0ff':'#ff4655';mm.beginPath();mm.arc(b.x/S*c,b.z/S*c,5,0,7);mm.fill()}});
 mm.save();mm.translate(P.x/S*c,P.z/S*c);mm.rotate(-P.yaw+Math.PI);mm.fillStyle='rgba(93,242,214,.25)';mm.beginPath();mm.moveTo(0,0);mm.arc(0,0,38,-Math.PI/2-.7,-Math.PI/2+.7);mm.fill();mm.fillStyle='#5df2d6';mm.beginPath();mm.arc(0,0,4.5,0,7);mm.fill();mm.restore()}
function hud(now){const w=WP[P.w];feedL=feedL.filter(e=>e.t>TT);
 $('fps').innerHTML=Math.round(fps)+' 帧/秒<small>'+QN[QL][0]+' · 灵敏度 '+sens.toFixed(1)+(ROOM?' · 房间 '+ROOM+' · 在线 '+(Object.keys(remotes).length+1)+' 人':'')+'</small>';
 $('score').innerHTML=score[0]+' : '+score[1];$('hp').innerHTML=Math.ceil(P.hp)+'<small> 生命 · 护甲'+['','(低)','(高)'][P.at]+' '+Math.ceil(P.ar)+'</small>';$('ammo').innerHTML=(P.rl>0?'换弹…':P.ammo)+' <small>/ '+P.res+' · '+w.n+'</small>';
 $('money').textContent='$'+money+'  手雷'+P.inv.g+' 烟'+P.inv.s+' 闪'+P.inv.f+' 药'+P.inv.m+' [Q 投掷:'+{g:'手雷',s:'烟雾',f:'闪光'}[P.sel]+']';
 $('feed').innerHTML=feedL.slice(-4).map(e=>'<div>'+e.s+'</div>').join('');$('low').style.opacity=Math.max(0,(60-P.hp)/60)*.9;$('gear').style.display=st==='menu'?'none':'block';
 const bt=$('bt');if(bt)bt.textContent=Math.max(0,Math.ceil(st==='buy'?buyT:P.shopT));const pn=$('pn');if(pn)pn.textContent=Object.keys(remotes).length+1;$('room').innerHTML=ROOM?'<small>房间号</small> '+ROOM+' <small>· 在线 '+(Object.keys(remotes).length+1)+' 人</small>'+(CONN?'':' <small style="color:#ff6b6b">· 连接中断，正在重连</small>')+(PEERS>1&&!Object.keys(remotes).length?' <small style="color:#ffd36b">· 已发现对方，等待位置数据…</small>':''):'';
 const gp=Math.round(Math.min(36,(P.moving?w.mv*.55:0)+P.rec*w.rs*.7+w.base*.45));$('cross').style.setProperty('--g',gp+'px');
 let ov=0,col='255,255,255';smokes.forEach(q=>{if(Math.hypot(P.x-q.x,P.z-q.z)<q.r*.85){ov=.92;col='185,190,198'}});if(P.fl>0){ov=Math.min(1,P.fl*1.3);col='255,255,255'}$('ov').style.background='rgba('+col+',1)';$('ov').style.opacity=ov}
function loop(now){sched();let dt=Math.min(.05,(now-last)/1000);last=now;dt*=TS;
 if(st==='play')update(dt);else if(st==='buy'){buyT-=dt;if(buyT<=0)ready()}
 if(grid){
  const bob=Math.sin(P.walk)*(P.moving?.03:.012);cam.position.set(P.x+Math.sin(now*.083)*P.shk*.5,1.65-.6*P.ch+P.y+bob+Math.cos(now*.097)*P.shk*.5,P.z);cam.rotation.set(P.pit+P.pun,P.yaw,0);
  const tf=scoped?22:78;fov+=(tf-fov)*Math.min(1,dt*18);if(Math.abs(cam.fov-fov)>.01){cam.fov=fov;cam.updateProjectionMatrix()}
  vm.visible=!scoped;vm.position.set(.24+Math.sin(P.walk*.5)*.006,-.24+Math.abs(Math.cos(P.walk*.5))*.006-(P.rl>0?.12:0),-.4+P.gk);vm.rotation.x=P.gk*1.5;
  if(mz){mz.visible=P.flash>0;flashL.intensity=P.flash>0?3:0}
  bots.forEach(b=>{if(b.remote&&b.tx!==undefined){b.x+=(b.tx-b.x)*Math.min(1,dt*14);b.z+=(b.tz-b.z)*Math.min(1,dt*14);b.g.rotation.y=b.yw+Math.PI}
   if(b.hp<=0&&b.die!==undefined&&b.die<1){b.die=Math.min(1,b.die+dt*2.2);const e=1-Math.pow(1-b.die,3);b.g.rotation.x=-1.45*e*(b.hsd?1.1:1);b.g.position.y=.35*e;b.g.rotation.z=b.sv*e*.35}
   b.g.position.x=b.x;b.g.position.z=b.z;const mvd=Math.hypot(b.x-b.px,b.z-b.pz);b.px=b.x;b.pz=b.z;if(b.hp>0){b.ph+=mvd*2.2;b.legs[0].rotation.x=Math.sin(b.ph)*.6;b.legs[1].rotation.x=-Math.sin(b.ph)*.6}
   b.mzb.visible=b.fl>0;const hl=b.hit>0?0x666666:0;b.mats.forEach(m=>m.emissive.setHex(hl));
   b.bar.visible=b.hpT>0&&b.hp>0;if(b.bar.visible){b.bar.position.set(b.x,2.25,b.z);b.bar.quaternion.copy(cam.quaternion);b.bar.scale.x=Math.max(.01,b.hp/b.ym)*.9}});
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;if(f.v){f.m.position.addScaledVector(f.v,dt);f.v.y-=12*dt;if(f.m.position.y<.03){f.m.position.y=.03;f.v.set(0,0,0)}}if(f.gr){f.m.scale.setScalar(1+(.35-f.t)*22);f.m.material.opacity=Math.max(0,f.t*2.5)}if(f.t<=0){sc.remove(f.m);if(f.l)sc.remove(f.l);fx.splice(i,1)}}
  if(ONL&&now-pT>66){pT=now;try{ONL.presence({id:MYID,x:+P.x.toFixed(2),z:+P.z.toFixed(2),yw:+P.yaw.toFixed(2),hp:Math.ceil(P.hp),hd:Object.assign({},P.hd),dc:P.dc,db:P.db,s:st})}catch(e){}dbg.textContent=ROOM?'伤害 发出 '+Object.values(P.hd).reduce((a,b)=>a+b,0)+' · 受到 '+Object.values(SH).reduce((a,b)=>a+b,0)+' · 对方状态 '+Object.values(remotes).map(o=>o.s||'?').join(','):''}
  if(now-mT>33){mT=now;drawMap()}}
 if(RAIN){rainStep(dt);if(QL!==4&&now-ddT>33){ddT=now;dropsDraw(.033)}}rd.render(sc,cam);fcn++;if(now-fT>=500){fps=fcn*1000/(now-fT);fcn=0;fT=now}if(now-hT>100){hT=now;hud(now)}}
setQ(1);build(0);setGun();(()=>{const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');['fps','score','hp','ammo','feed','room'].forEach(id=>{const e=$(id);Object.defineProperty(e,'innerHTML',{set(v){if(e._h!==v){e._h=v;d.set.call(e,v)}},get(){return d.get.call(e)}})});const t=Object.getOwnPropertyDescriptor(Node.prototype,'textContent'),m=$('money');Object.defineProperty(m,'textContent',{set(v){if(m._t!==v){m._t=v;t.set.call(m,v)}},get(){return t.get.call(m)}})})();
showMenu();sched();
